<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 免备案实时弹幕系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: -apple-system, sans-serif; color: #fff; }
    #screen { position: relative; width: 100vw; height: 100vh; }
    
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      will-change: transform;
    }

    /* 手机端输入界面 */
    #mobile-view {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #1e293b;
      z-index: 100;
      padding: 40px 20px;
      flex-direction: column;
      gap: 15px;
    }
    input { padding: 14px; font-size: 16px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; outline: none; }
    button { padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }

    /* 大屏二维码及状态栏 */
    #qrcode-box {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      color: #000;
    }
    #qrcode-box img { width: 130px; height: 130px; }
    #status-text { position: absolute; top: 10px; left: 10px; font-size: 12px; color: #64748b; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div id="status-text">正在初始化服务器连接...</div>
  <div id="screen"></div>

  <!-- 1. 二维码展示区 -->
  <div id="qrcode-box">
    <div id="qrcode"></div>
    <p style="font-size: 12px; font-weight: bold; margin-top: 4px;">手机扫码发送弹幕</p>
  </div>

  <!-- 2. 手机控制端界面 -->
  <div id="mobile-view">
    <h2 style="text-align: center;">🚀 现场发送弹幕</h2>
    <p id="mobile-status" style="text-align: center; color: #38bdf8; font-size: 14px;">正在建立连接...</p>
    <input type="text" id="msgInput" placeholder="请输入你要说的文字..." maxlength="30">
    <button onclick="sendDanmaku()">发射弹幕</button>
  </div>

  <script>
    const hash = window.location.hash.replace('#', '');
    const screen = document.getElementById('screen');
    const statusText = document.getElementById('status-text');

    // 💡 情况 A：如果是手机扫码进来的（URL 带有 #房间号）
    if (hash) {
      document.getElementById('mobile-view').style.display = 'flex';
      document.getElementById('qrcode-box').style.display = 'none';

      // 链接到公开 PeerJS 信令服务
      const peer = new Peer();
      let conn = null;

      peer.on('open', () => {
        document.getElementById('mobile-status').innerText = '正在呼叫大屏...';
        conn = peer.connect(hash);

        conn.on('open', () => {
          document.getElementById('mobile-status').innerText = '✅ 已成功连接大屏，随时可以发送！';
        });

        conn.on('error', (err) => {
          document.getElementById('mobile-status').innerText = '❌ 连接失败，请重新扫码';
        });
      });

      window.sendDanmaku = function() {
        const input = document.getElementById('msgInput');
        if (conn && input.value.trim()) {
          conn.send(input.value.trim());
          input.value = '';
          document.getElementById('mobile-status').innerText = '🎉 发送成功！';
          setTimeout(() => {
            document.getElementById('mobile-status').innerText = '✅ 已成功连接大屏';
          }, 1500);
        } else {
          alert('未能建立连接，请刷新页面重试');
        }
      }
    } 
    // 💡 情况 B：如果是电脑大屏端
    else {
      // 随机生成固定长度房间号
      const roomId = 'dm_' + Math.random().toString(36).substring(2, 8);
      const peer = new Peer(roomId);

      peer.on('open', (id) => {
        statusText.innerText = '系统就绪 | 房间 ID: ' + id;
        
        // 动态构建包含 #房间号 的完整手机访问链接
        const mobileUrl = window.location.href.split('#')[0] + '#' + id;
        
        new QRCode(document.getElementById("qrcode"), {
          text: mobileUrl,
          width: 130,
          height: 130
        });
      });

      // 监听手机的连接请求
      peer.on('connection', (conn) => {
        statusText.innerText = '📱 提示：有新手机进入房间！';

        conn.on('data', (data) => {
          renderDanmaku(data);
        });
      });

      // 渲染弹幕逻辑
      function renderDanmaku(text) {
        const el = document.createElement('div');
        el.className = 'danmaku-item';
        el.innerText = text;

        const track = Math.floor(Math.random() * (window.innerHeight / 60 - 2));
        el.style.top = (track * 60 + 20) + 'px';

        screen.appendChild(el);

        const anim = el.animate([
          { transform: `translateX(${window.innerWidth}px)` },
          { transform: `translateX(-100%)` }
        ], {
          duration: 7000,
          easing: 'linear'
        });

        anim.onfinish = () => el.remove();
      }
    }
  </script>
</body>
</html>
