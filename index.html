<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>原生通用 WebSocket 实时弹幕</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; font-family: -apple-system, sans-serif; color: #fff; }
    
    #screen { position: relative; width: 100vw; height: 100vh; }
    
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
      will-change: transform;
    }

    #mobile-view {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #121212;
      z-index: 100;
      padding: 40px 20px;
      flex-direction: column;
      gap: 15px;
    }
    input { padding: 14px; font-size: 16px; border: 1px solid #333; border-radius: 8px; background: #222; color: #fff; outline: none; }
    button { padding: 14px; background: #007aff; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }

    #qrcode-box {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: #fff;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      color: #000;
      z-index: 50;
    }
    #qrcode-box img { width: 130px; height: 130px; }
    #status-text { position: absolute; top: 10px; left: 10px; font-size: 12px; color: #888; }
  </style>
  <!-- 仅引入原生二维码库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <div id="status-text">正在建立直连...</div>
  <div id="screen"></div>

  <div id="qrcode-box">
    <div id="qrcode"></div>
    <p style="font-size: 12px; font-weight: bold; margin-top: 4px;">扫码发送弹幕</p>
  </div>

  <div id="mobile-view">
    <h2 style="text-align: center;">🚀 现场发送弹幕</h2>
    <p id="mobile-status" style="text-align: center; color: #007aff; font-size: 14px;">正在连接通信管道...</p>
    <input type="text" id="msgInput" placeholder="请输入你想表达的文字..." maxlength="30">
    <button onclick="sendDanmaku()">发射弹幕</button>
  </div>

  <script>
    const hash = window.location.hash.replace('#', '');
    const screen = document.getElementById('screen');
    const statusText = document.getElementById('status-text');

    // 使用开放公共的原生 WebSocket 管道
    const WS_SERVER = 'wss://piehost.com/websocket/danmaku-demo-channel-99';
    let ws = null;

    // 💡 场景 A：手机端
    if (hash) {
      document.getElementById('mobile-view').style.display = 'flex';
      document.getElementById('qrcode-box').style.display = 'none';

      ws = new WebSocket(WS_SERVER);

      ws.onopen = () => {
        document.getElementById('mobile-status').innerText = '✅ 已成功接入网络，随时可发射！';
      };

      ws.onerror = () => {
        document.getElementById('mobile-status').innerText = '❌ 网络连接受限，请断开代理或WiFi后重试';
      };

      window.sendDanmaku = function() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (text && ws && ws.readyState === WebSocket.OPEN) {
          // 构造附带房间号的数据包发送
          ws.send(JSON.stringify({ room: hash, text: text }));
          input.value = '';
          document.getElementById('mobile-status').innerText = '🎉 发送成功！';
          setTimeout(() => {
            document.getElementById('mobile-status').innerText = '✅ 已成功接入网络，随时可发射！';
          }, 1200);
        }
      };

    } 
    // 💡 场景 B：电脑大屏端
    else {
      const roomId = 'room_' + Math.floor(100000 + Math.random() * 900000);

      ws = new WebSocket(WS_SERVER);

      ws.onopen = () => {
        statusText.innerText = '通信建立成功 | 房间号: ' + roomId;
      };

      // 动态画出手机二维码
      const mobileUrl = window.location.href.split('#')[0] + '#' + roomId;
      new QRCode(document.getElementById("qrcode"), {
        text: mobileUrl,
        width: 130,
        height: 130
      });

      // 接收广播消息
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          // 只有收到匹配当前房间号的消息才渲染
          if (data && data.room === roomId && data.text) {
            renderDanmaku(data.text);
          }
        } catch(e) {}
      };

      function renderDanmaku(text) {
        const el = document.createElement('div');
        el.className = 'danmaku-item';
        el.innerText = text;

        const trackCount = Math.floor(window.innerHeight / 55) - 2;
        const randomTrack = Math.floor(Math.random() * Math.max(1, trackCount));
        el.style.top = (randomTrack * 55 + 20) + 'px';

        screen.appendChild(el);

        const anim = el.animate([
          { transform: `translateX(${window.innerWidth}px)` },
          { transform: `translateX(-100%)` }
        ], {
          duration: 7000,
          easing: 'linear'
        });

        anim.onfinish = () => el.remove();
      }
    }
  </script>
</body>
</html>
